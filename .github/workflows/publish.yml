name: Publish to npm

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/npm-bootstrap.trigger
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Publish the initial psych-rulekit package version
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'push' ||
      inputs.bootstrap == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        if: github.event_name == 'release'
        run: >-
          node --input-type=module --eval
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) {
          throw new Error('Release tag must equal v' + pkg.version); }"

      - name: Verify bootstrap target
        if: github.event_name != 'release'
        run: >-
          node --input-type=module --eval
          "import pkg from './package.json' with { type: 'json' };
          if (pkg.name !== 'psych-rulekit' || pkg.version !== '0.1.0') {
          throw new Error('Bootstrap is restricted to psych-rulekit@0.1.0'); }"

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish --access public --provenance
